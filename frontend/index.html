<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Vibely</title>

    <script src="https://cdn.tailwindcss.com"></script>

    <link rel="stylesheet" href="css/styles.css">
</head>

<body class="bg-zinc-950 text-white min-h-screen">

    <!-- Navbar -->
    <nav class="flex justify-between items-center px-8 py-5 border-b border-zinc-800">
        <h1 class="text-2xl font-bold">
            Vibely
        </h1>

        <button
            id="spotifyLogin"
            class="bg-green-500 hover:bg-green-400 text-black font-semibold px-5 py-2 rounded-full"
        >
            Connect Spotify
        </button>
    </nav>

    <!-- Shown after returning from Spotify's login page -->
    <div id="spotifyMessage" class="hidden text-center px-6 py-3"></div>


    <!-- Hero / Home -->
    <main class="max-w-4xl mx-auto px-6 py-20">

        <section class="text-center mb-16">

            <h2 class="text-5xl font-bold mb-5">
                Find the soundtrack for your exact vibe.
            </h2>

            <p class="text-zinc-400 text-lg">
                Describe your mood, moment, or situation and Vibely will
                create a Spotify playlist that matches it.
            </p>

        </section>


        <!-- Mood Form -->
        <section class="bg-zinc-900 rounded-2xl p-8 shadow-lg">

            <h3 class="text-2xl font-semibold mb-4">
                What's your vibe?
            </h3>

            <form id="moodForm">

                <textarea
                    id="moodInput"
                    rows="4"
                    placeholder="Example: driving through a rainy city at 2 AM feeling slightly nostalgic..."
                    class="w-full bg-zinc-800 border border-zinc-700 rounded-xl p-4 focus:outline-none focus:ring-2 focus:ring-green-500"
                ></textarea>

                <button
                    id="generateButton"
                    type="submit"
                    class="mt-4 bg-green-500 hover:bg-green-400 text-black font-semibold px-6 py-3 rounded-full disabled:opacity-50 disabled:cursor-wait"
                >
                    Generate Playlist
                </button>

            </form>

        </section>


        <!-- Recommendation Results -->
        <section id="recommendations" class="mt-16 hidden">

            <h3 class="text-2xl font-semibold mb-6">
                Recommended Songs
            </h3>

            <!-- Loading, error, and "no songs" messages -->
            <p id="recommendationStatus" class="text-zinc-400 mb-4"></p>

            <!-- Filled in by js/app.js, one card per song -->
            <div id="songList" class="space-y-4"></div>

        </section>


        <!-- Playlist Preview -->
        <section id="playlistPreview" class="mt-16 hidden">

            <h3 class="text-2xl font-semibold mb-4">
                Your Vibely Playlist
            </h3>

            <div class="bg-zinc-900 rounded-xl p-6">

                <div class="flex justify-between items-baseline mb-2">
                    <label for="playlistName" class="text-zinc-400">
                        Playlist name <span class="text-zinc-500 text-sm">(suggested from your mood, edit it if you like)</span>
                    </label>

                    <!-- Shown only after the user changes the suggested name -->
                    <button
                        id="useSuggestedName"
                        type="button"
                        class="hidden text-sm text-green-400 hover:text-green-300 underline"
                    >
                        Use suggested name
                    </button>
                </div>

                <input
                    id="playlistName"
                    type="text"
                    maxlength="100"
                    class="w-full bg-zinc-800 border border-zinc-700 rounded-xl p-3 mb-4 focus:outline-none focus:ring-2 focus:ring-green-500"
                >

                <button
                    id="savePlaylist"
                    class="bg-green-500 hover:bg-green-400 text-black font-semibold px-6 py-3 rounded-full disabled:opacity-50 disabled:cursor-wait"
                >
                    Save to Spotify
                </button>

                <!-- Saving, success (with a link to the playlist), and error messages -->
                <p id="playlistStatus" class="mt-4 hidden"></p>

            </div>

        </section>

    </main>


    <script src="js/app.js"></script>

</body>
</html>
